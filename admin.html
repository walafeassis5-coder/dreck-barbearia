<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DRECK • Painel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#090909;
  color:#fff;
  font-family:Arial,sans-serif;
}
main{
  width:min(100%,600px);
  margin:auto;
  padding:25px 18px 60px;
}
h1{
  color:#d6ad60;
  font-size:38px;
  letter-spacing:3px;
  margin-bottom:4px;
}
.sub{
  color:#999;
  margin-bottom:28px;
}
.card{
  background:#151515;
  border:1px solid #332b1c;
  border-radius:18px;
  padding:20px;
  margin-bottom:16px;
}
input,button,select{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:11px;
  border:1px solid #444;
  background:#0d0d0d;
  color:white;
  font-size:16px;
}
button{
  border:none;
  background:#d6ad60;
  color:#111;
  font-weight:bold;
}
button.secondary{
  background:#292929;
  color:#fff;
}
button.confirm{
  background:#2f8f55;
  color:#fff;
}
button.cancel{
  background:#8c3434;
  color:#fff;
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.top button{
  width:auto;
  padding:10px 14px;
  margin:0;
}
.booking{
  background:#101010;
  border:1px solid #333;
  border-radius:14px;
  padding:16px;
  margin-top:12px;
}
.booking strong{
  font-size:18px;
}
.gold{color:#d6ad60}
.muted{color:#999}
.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  margin-top:8px;
  font-size:13px;
  background:#333;
}
.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}
.actions button{margin:0}
#dashboard{display:none}
#error{
  color:#ff7c7c;
  margin-top:12px;
}
.empty{
  text-align:center;
  color:#888;
  padding:25px 0;
}
</style>
</head>

<body>
<main>

<h1>DRECK</h1>
<div class="sub">PAINEL ADMINISTRATIVO</div>

<section id="login" class="card">
  <h2>Entrar</h2>

  <input
    id="email"
    type="email"
    placeholder="E-mail do administrador"
  >

  <input
    id="password"
    type="password"
    placeholder="Senha"
  >

  <button onclick="login()">ENTRAR NO PAINEL</button>

  <div id="error"></div>
</section>

<section id="dashboard">

  <div class="card top">
    <div>
      <strong>Agenda DRECK</strong><br>
      <span class="muted">Agendamentos dos clientes</span>
    </div>

    <button class="secondary" onclick="logout()">
      Sair
    </button>
  </div>

  <div class="card">
    <button onclick="loadBookings()">
      🔄 ATUALIZAR AGENDA
    </button>

    <div id="bookings"></div>
  </div>

</section>
<div class="card">
  <h2>🚫 Bloquear horário</h2>

  <input id="blockDate" type="date">

  <select id="blockTime">
    <option value="">Escolha o horário</option>
    <option value="10:00">10:00</option>
    <option value="11:30">11:30</option>
    <option value="13:00">13:00</option>
    <option value="15:00">15:00</option>
    <option value="17:30">17:30</option>
    <option value="19:00">19:00</option>
    <option value="20:00">20:00</option>
  </select>

  <button onclick="blockSlot()">
    BLOQUEAR HORÁRIO
  </button>

  <div id="blockedSlots"></div>
</div>

</main>

<script>
const cfg = window.DRECK_SUPABASE;

const db = supabase.createClient(
  cfg.url,
  cfg.anonKey
);

const loginBox = document.getElementById("login");
const dashboard = document.getElementById("dashboard");
const errorBox = document.getElementById("error");
const bookingsBox = document.getElementById("bookings");

function statusName(status){
  if(status === "confirmed") return "✅ Confirmado";
  if(status === "cancelled") return "❌ Cancelado";
  return "⏳ Pendente";
}

function formatDate(value){
  if(!value) return "";
  const parts = value.split("-");
  return `${parts[2]}/${parts[1]}/${parts[0]}`;
}

async function login(){

  errorBox.innerText = "";

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if(!email || !password){
    errorBox.innerText =
      "Digite seu e-mail e sua senha.";
    return;
  }

  const { error } =
    await db.auth.signInWithPassword({
      email,
      password
    });

  if(error){
    errorBox.innerText =
      "Não foi possível entrar: " + error.message;
    return;
  }

  showDashboard();
}

async function logout(){

  await db.auth.signOut();

  dashboard.style.display = "none";
  loginBox.style.display = "block";
}

async function showDashboard(){
await loadBlockedSlots();

  loginBox.style.display = "none";
  dashboard.style.display = "block";

  await loadBookings();
}

async function loadBookings(){

  bookingsBox.innerHTML =
    '<p class="muted">Carregando agenda...</p>';

  const { data, error } = await db
    .from("bookings")
    .select("*")
    .order("booking_date", { ascending:true })
    .order("booking_time", { ascending:true });

  if(error){
    bookingsBox.innerHTML =
      `<p id="error">${error.message}</p>`;
    return;
  }

  if(!data || data.length === 0){
    bookingsBox.innerHTML =
      '<div class="empty">Nenhum agendamento encontrado.</div>';
    return;
  }

  bookingsBox.innerHTML = "";

  data.forEach(item => {

    const price =
      Number(item.price || 0).toLocaleString(
        "pt-BR",
        {
          style:"currency",
          currency:"BRL"
        }
      );

    const el = document.createElement("div");
    el.className = "booking";

    el.innerHTML = `
      <strong>${item.customer_name || "Cliente"}</strong>

      <div class="gold" style="margin-top:8px">
        ${item.service_name || "Serviço"}
      </div>

      <div style="margin-top:8px">
        📅 ${formatDate(item.booking_date)}
        &nbsp; • &nbsp;
        🕐 ${String(item.booking_time).slice(0,5)}
      </div>

      <div style="margin-top:7px">
        💰 ${price}
      </div>

      <div class="status">
        ${statusName(item.status)}
      </div>

      <div class="actions">
        <button
          class="confirm"
          onclick="changeStatus('${item.id}','confirmed')"
        >
          Confirmar
        </button>

        <button
          class="cancel"
          onclick="changeStatus('${item.id}','cancelled')"
        >
          Cancelar
        </button>
      </div>
    `;

    bookingsBox.appendChild(el);
  });
}

async function changeStatus(id,status){

  const { error } = await db
    .from("bookings")
    .update({ status })
    .eq("id",id);

  if(error){
    alert("Erro: " + error.message);
    return;
  }

  await loadBookings();
}
async function blockSlot(){

  const booking_date =
    document.getElementById("blockDate").value;

  const booking_time =
    document.getElementById("blockTime").value;

  if(!booking_date || !booking_time){
    alert("Escolha a data e o horário.");
    return;
  }

  const { error } = await db
    .from("blocked_slots")
    .insert({
      booking_date,
      booking_time
    });

  if(error){
    alert("Erro ao bloquear: " + error.message);
    return;
  }

  alert("Horário bloqueado com sucesso.");

  await loadBlockedSlots();
}

async function loadBlockedSlots(){

  const box =
    document.getElementById("blockedSlots");

  const { data, error } = await db
    .from("blocked_slots")
    .select("*")
    .order("booking_date", { ascending:true })
    .order("booking_time", { ascending:true });

  if(error){
    box.innerHTML =
      "<p>Erro ao carregar horários bloqueados.</p>";
    return;
  }

  if(!data || data.length === 0){
    box.innerHTML =
      '<p class="muted">Nenhum horário bloqueado.</p>';
    return;
  }

  box.innerHTML = "<h3>Horários bloqueados</h3>";

  data.forEach(item => {

    const div = document.createElement("div");

    div.className = "booking";

    div.innerHTML = `
      📅 ${formatDate(item.booking_date)}
      • 🕐 ${String(item.booking_time).slice(0,5)}

      <button
        class="secondary"
        onclick="unblockSlot('${item.id}')"
      >
        Liberar horário
      </button>
    `;

    box.appendChild(div);
  });
}

async function unblockSlot(id){

  const { error } = await db
    .from("blocked_slots")
    .delete()
    .eq("id", id);

  if(error){
    alert("Erro ao liberar horário: " + error.message);
    return;
  }

  await loadBlockedSlots();
}
async function checkSession(){

  const {
    data:{ session }
  } = await db.auth.getSession();

  if(session){
    showDashboard();
  }
}

checkSession();
</script>

</body>
</html>
