<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DRECK Barbearia</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif}
main{max-width:500px;margin:auto;padding:30px 20px}
h1{font-size:45px;margin:20px 0 5px;color:#d6ad60}
.sub{color:#aaa;margin-bottom:35px}
.card{background:#151515;border:1px solid #332b1c;border-radius:18px;padding:20px;margin:15px 0}
label{display:block;margin:15px 0 6px;color:#bbb}
input,select,button{width:100%;padding:15px;border-radius:12px;border:1px solid #444;background:#111;color:white;font-size:16px;box-sizing:border-box}
button{margin-top:20px;background:#d6ad60;color:#080808;border:0;font-weight:bold}
.price{float:right;color:#d6ad60}
#msg{margin-top:15px;line-height:1.5}
</style>
</head>
<body>
<main>
<h1>DRECK</h1>
<div class="sub">BARBEARIA • DESDE 2019</div>

<div class="card">
<h2>Agende seu horário</h2>

<label>Seu nome</label>
<input id="nome" placeholder="Digite seu nome">
<input id="telefone" type="tel" placeholder="Seu WhatsApp (DDD + número)" inputmode="numeric">

<label>Serviço</label>
<select id="servico">
<option value="Corte masculino|35">Corte masculino — R$ 35</option>
<option value="Barba|25">Barba — R$ 25</option>
<option value="Corte + barba|55">Corte + barba — R$ 55</option>
<option value="Pezinho|15">Pezinho — R$ 15</option>
<option value="Sobrancelha|10">Sobrancelha — R$ 10</option>
</select>

<label>Data</label>
<input type="date" id="data" min="">

<label>Horário</label>
<select id="hora">
<option value="10:00">10:00</option>
<option value="11:30">11:30</option>
<option value="13:00">13:00</option>
<option value="15:00">15:00</option>
<option value="17:30">17:30</option>
<option value="19:00">19:00</option>
<option value="20:00">20:00</option>
</select>

<button onclick="agendar()">CONFIRMAR AGENDAMENTO</button>
<div id="msg"></div>
</div>
</main>

<script>
const hoje = new Date();
const ano = hoje.getFullYear();
const mes = String(hoje.getMonth() + 1).padStart(2, "0");
const dia = String(hoje.getDate()).padStart(2, "0");

document.getElementById("data").min =
  `${ano}-${mes}-${dia}`;
const cfg=window.DRECK_SUPABASE;
const db=supabase.createClient(cfg.url,cfg.anonKey);

async function agendar(){
 const nome=document.getElementById('nome').value.trim();
 const telefone=document.getElementById('telefone').value.trim();
 const serv=document.getElementById('servico').value.split('|');
 const data=document.getElementById('data').value;
 const hora=document.getElementById('hora').value;
 const msg=document.getElementById('msg');

 if(!nome||!telefone||!data){
  msg.innerHTML='⚠️ Preencha seu nome, WhatsApp e a data.';
  return;
 }

 msg.innerHTML='Agendando...';

 const {data:r,error}=await db.rpc('create_booking',{
  p_customer_name:nome,
  p_customer_phone:telefone,
  p_service_name:serv[0],
  p_price:Number(serv[1]),
  p_booking_date:data,
  p_booking_time:hora
 });

 if(error){
  msg.innerHTML='❌ '+error.message;
  return;
 }

msg.innerHTML = `
  <div style="
    margin-top:18px;
    padding:18px;
    border:1px solid #c9a227;
    border-radius:14px;
    background:#111;
    text-align:left;
  ">
    <div style="
      color:#c9a227;
      font-size:20px;
      font-weight:bold;
      margin-bottom:12px;
      text-align:center;
    ">
      ✅ Agendamento realizado!
    </div>

    <div>✂️ <strong>Serviço:</strong> ${serv[0]}</div>
    <div style="margin-top:8px">
      📅 <strong>Data:</strong> ${data.split("-").reverse().join("/")}
    </div>
    <div style="margin-top:8px">
      🕐 <strong>Horário:</strong> ${hora}
    </div>
    <div style="margin-top:8px">
      💰 <strong>Valor:</strong> R$ ${Number(serv[1]).toFixed(2).replace(".", ",")}
    </div>

    <div style="
      margin-top:14px;
      text-align:center;
      color:#aaa;
      font-size:13px;
    ">
      Seu horário foi reservado na DRECK Barbearia.
    </div>
    <div style="margin-top:20px;text-align:center;">
  <strong style="color:#c9a227;font-size:18px;">
    💳 Como deseja pagar?
  </strong>

  <div style="margin-top:14px;">
    <button type="button" onclick="mostrarPix()"
      style="width:100%;padding:14px;margin-bottom:10px;background:#c9a227;color:#111;border:0;border-radius:10px;font-weight:bold;">
      💠 PAGAR AGORA VIA PIX
    </button>

    <button type="button" onclick="pagamentoPresencial()"
      style="width:100%;padding:14px;background:#222;color:white;border:1px solid #c9a227;border-radius:10px;font-weight:bold;">
      💵 PAGAR PRESENCIALMENTE
    </button>
  </div>

  <div id="opcaoPagamento" style="margin-top:14px;"></div>
</div>
    <a href="https://wa.me/5562992841305"
   target="_blank"
   style="
     display:block;
     margin-top:16px;
     padding:14px;
     background:#25D366;
     color:white;
     text-align:center;
     text-decoration:none;
     font-weight:bold;
     border-radius:10px;
   ">
  💬 FALAR NO WHATSAPP
</a>
  </div>
`;
}

async function atualizarHorariosBloqueados() {
  const dataSelecionada = document.getElementById("data").value;
  const campoHora = document.getElementById("hora");
  const agora = new Date();

const hojeLocal =
  `${agora.getFullYear()}-${String(agora.getMonth() + 1).padStart(2, "0")}-${String(agora.getDate()).padStart(2, "0")}`;

const horarioAtual =
  `${String(agora.getHours()).padStart(2, "0")}:${String(agora.getMinutes()).padStart(2, "0")}`;

  if (!dataSelecionada) return;
  Array.from(campoHora.options).forEach(option => {
  if (!option.value) return;

  option.disabled = false;
  option.textContent = option.value;
});
  if (new Date(dataSelecionada + "T00:00:00") < new Date(hojeLocal + "T00:00:00")) {
  Array.from(campoHora.options).forEach(option => {
    if (!option.value) return;
    option.disabled = true;
    option.textContent = option.value + " — INDISPONÍVEL";
  });

  campoHora.value = "";
  return;
}

  const { data: indisponiveis, error } = await db.rpc(
    "get_unavailable_times",
    {
      p_booking_date: dataSelecionada
    }
  );

  if (error) {
    console.error("Erro ao consultar horários indisponíveis:", error);
    return;
  }

  const horariosIndisponiveis = (indisponiveis || []).map(
    item => String(item.booking_time).slice(0, 5)
  );

  Array.from(campoHora.options).forEach(option => {
    if (!option.value) return;

const dataEscolhidaObj = new Date(dataSelecionada + "T00:00:00");
const hojeObj = new Date(hojeLocal + "T00:00:00");

const horarioPassou =
  dataEscolhidaObj.getTime() === hojeObj.getTime() &&
  option.value <= horarioAtual;
const indisponivel =
  horariosIndisponiveis.includes(option.value) ||
  horarioPassou;
    option.disabled = indisponivel;

    const horario = option.value;

    option.textContent = indisponivel
      ? horario + " — INDISPONÍVEL"
      : horario;
  });

  if (horariosIndisponiveis.includes(campoHora.value)) {
    campoHora.value = "";
  }
}
  document
.getElementById("data")
  .addEventListener("change", atualizarHorariosBloqueados);
function mostrarPix() {
  const box = document.getElementById("opcaoPagamento");

  box.innerHTML = `
    <div style="padding:16px;border:1px solid #c9a227;border-radius:12px;background:#181818;">
      <div style="color:#c9a227;font-weight:bold;font-size:18px;">
        💠 PAGAMENTO VIA PIX
      </div>

      <div style="margin-top:12px;">
        Chave PIX (Telefone):
      </div>

      <div style="font-size:20px;font-weight:bold;margin-top:6px;">
        62992841305
      </div>

      <button type="button"
        onclick="copiarPix()"
        style="width:100%;padding:12px;margin-top:12px;background:#c9a227;color:#111;border:0;border-radius:10px;font-weight:bold;">
        📋 COPIAR CHAVE PIX
      </button>

      <div style="margin-top:15px;font-size:14px;">
        Após concluir o pagamento, envie o comprovante para o WhatsApp da DRECK.
      </div>

      <a href="https://wa.me/5562992841305?text=Olá!%20Realizei%20o%20pagamento%20via%20PIX%20do%20meu%20agendamento%20na%20DRECK.%20Segue%20o%20comprovante:"
        target="_blank"
        style="display:block;margin-top:12px;padding:13px;background:#25D366;color:white;text-decoration:none;border-radius:10px;font-weight:bold;">
        💬 ENVIAR COMPROVANTE
      </a>
    </div>
  `;
}

function pagamentoPresencial() {
  const box = document.getElementById("opcaoPagamento");

  box.innerHTML = `
    <div style="padding:16px;border:1px solid #c9a227;border-radius:12px;background:#181818;">
      <strong style="color:#c9a227;">💵 PAGAMENTO PRESENCIAL</strong>
      <div style="margin-top:10px;">
        Tudo certo! Seu agendamento está reservado.<br>
        O pagamento será realizado presencialmente no dia do atendimento.
      </div>
    </div>
  `;
}

function copiarPix() {
  navigator.clipboard.writeText("62992841305");
  alert("Chave PIX copiada!");
}
</script>
</body>
</html>
